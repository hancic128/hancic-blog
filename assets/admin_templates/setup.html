{% extends "layout.html" %}
{% block title %}初始化管理员密码{% endblock %}
{% block content %}
<div class="auth-box">
  <h1>初始化管理员密码</h1>
  <p class="muted">首次使用请设置管理员密码（至少 {{ password_min_len }} 个字符）。</p>
  <form method="post" action="{{ base_path }}/admin/setup" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label class="field">新密码
      <input type="password" name="password" required minlength="{{ password_min_len }}">
    </label>
    <button type="submit" class="btn btn-primary">设置并进入后台</button>
  </form>
</div>
{% endblock %}
