<!DOCTYPE html>
<html lang="zh-CN" data-mode="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf }}">
<title>{% block title %}管理后台{% endblock %} · {{ site_name }}</title>
<link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside class="admin-side" id="admin-side">
    <div class="admin-brand">{{ site_name }}<small>管理后台</small></div>
    <nav class="admin-nav">
      {% for item in admin_nav %}
      <a href="{{ item.url }}" class="admin-nav-item{% if item.active %} active{% endif %}">{{ item.label }}</a>
      {% endfor %}
    </nav>
    <a class="admin-logout" href="/admin/logout">退出登录</a>
  </aside>
  <div class="admin-main">
    <button class="admin-toggle" id="admin-toggle" type="button" aria-label="展开导航">☰</button>
    <main class="admin-content">{% block content %}{% endblock %}</main>
  </div>
</div>
<script src="/static/admin.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
