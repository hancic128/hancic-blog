{% extends "layout.html" %}
{% block title %}系统设置{% endblock %}
{% block content %}
<h1>系统设置</h1>

<div class="panel">
  <section class="panel-section">
  <h2>显示与时区</h2>
  {% if settings_error %}
  <p class="error">{{ settings_error }}</p>
  {% endif %}
  <form method="post" action="{{ base_path }}/admin/system/save">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="field">
      <label for="theme-mode">主题模式</label>
      <div class="cs" data-select="#theme-mode">
      <button class="cs-btn" type="button" aria-label="主题模式" aria-haspopup="listbox" aria-expanded="false"></button>
      <select id="theme-mode" name="theme_mode" class="cs-hidden">
        <option value="auto"{% if form.theme_mode == "auto" %} selected{% endif %}>自动</option>
        <option value="light"{% if form.theme_mode == "light" %} selected{% endif %}>浅色</option>
        <option value="dark"{% if form.theme_mode == "dark" %} selected{% endif %}>深色</option>
      </select>
    </div>
    </div>
    <div class="field">
      <label for="timezone">时区</label>
      <div class="cs" data-select="#timezone">
      <button class="cs-btn" type="button" aria-label="时区" aria-haspopup="listbox" aria-expanded="false"></button>
      <select id="timezone" name="timezone" class="cs-hidden">
        {% for tz in timezones %}
        <option value="{{ tz }}"{% if form.timezone == tz %} selected{% endif %}>{{ tz }}</option>
        {% endfor %}
        {% if form.timezone and form.timezone not in timezones %}
        <option value="{{ form.timezone }}" selected>{{ form.timezone }}（当前）</option>
        {% endif %}
      </select>
    </div>
      <p class="muted">影响后台时间显示与前台日期格式化</p>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">保存设置</button>
    </div>
  </form>
</section>

  <section class="panel-section">
  <h2>修改密码</h2>
  {% if password_error %}
  <p class="error">{{ password_error }}</p>
  {% endif %}
  <form method="post" action="{{ base_path }}/admin/system/password">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="field">
      <label for="old-password">旧密码</label>
      <input id="old-password" name="old_password" type="password" required>
    </div>
    <div class="field">
      <label for="new-password">新密码</label>
      <input id="new-password" name="new_password" type="password" required minlength="8">
    </div>
    <div class="field">
      <label for="confirm-password">确认新密码</label>
      <input id="confirm-password" name="confirm" type="password" required minlength="8">
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">修改密码</button>
    </div>
  </form>
</section>
</div>
{% endblock %}
