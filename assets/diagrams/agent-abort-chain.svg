<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="中断是一条链路：前端 abort 之后，取消信号要依次穿过服务端编排、工具循环、任务队列，最后落到 LLM 调用层，中间断一环就只剩前端不显示，推理仍在云端跑">
  <title>中断是一条链路，断一环就只剩前端不显示</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke-linejoin="round">
    <text x="360" y="28" font-size="14" fill="currentColor" fill-opacity="0.6" text-anchor="middle">取消信号要一路穿到 LLM 调用层，才是真的停</text>

    <rect x="40" y="52" width="130" height="56" rx="10" fill="#d97706" fill-opacity="0.06" stroke="#d97706" stroke-opacity="0.42" stroke-width="1.5"/>
    <text x="105" y="76" font-size="15" font-weight="600" fill="currentColor" fill-opacity="0.9" text-anchor="middle">前端 abort</text>
    <text x="105" y="95" font-size="12" fill="currentColor" fill-opacity="0.55" text-anchor="middle">只断了读取</text>
    <line x1="174" y1="80" x2="214" y2="80" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="218" y="52" width="130" height="56" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
    <text x="283" y="76" font-size="15" fill="currentColor" fill-opacity="0.9" text-anchor="middle">服务端编排</text>
    <text x="283" y="95" font-size="12" fill="currentColor" fill-opacity="0.55" text-anchor="middle">请求上下文</text>
    <line x1="352" y1="80" x2="392" y2="80" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="396" y="52" width="130" height="56" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
    <text x="461" y="76" font-size="15" fill="currentColor" fill-opacity="0.9" text-anchor="middle">工具循环</text>
    <text x="461" y="95" font-size="12" fill="currentColor" fill-opacity="0.55" text-anchor="middle">在途工具调用</text>
    <line x1="530" y1="80" x2="570" y2="80" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="574" y="52" width="106" height="56" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
    <text x="627" y="76" font-size="15" fill="currentColor" fill-opacity="0.9" text-anchor="middle">LLM 调用</text>
    <text x="627" y="95" font-size="12" fill="currentColor" fill-opacity="0.55" text-anchor="middle">推理真正停</text>

    <rect x="40" y="140" width="640" height="66" rx="10" fill="#dc2626" fill-opacity="0.06" stroke="#dc2626" stroke-opacity="0.42" stroke-width="1.5"/>
    <text x="64" y="166" font-size="16" font-weight="600" fill="currentColor" fill-opacity="0.9">中间断一环会怎样</text>
    <text x="64" y="188" font-size="13" fill="currentColor" fill-opacity="0.6">信号没传到推理层：界面停了，云端还在跑，token 还在烧，半截内容还回流进上下文</text>

    <rect x="40" y="224" width="640" height="46" rx="10" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="360" y="245" font-size="13" font-weight="600" fill="currentColor" fill-opacity="0.9" text-anchor="middle">JS / TS：RequestOptions 有 signal，能一路传下去</text>
    <text x="360" y="263" font-size="13" fill="currentColor" fill-opacity="0.6" text-anchor="middle">Python：两家 SDK 都没有 signal，只有 timeout</text>

    <rect x="40" y="288" width="640" height="40" rx="10" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="360" y="313" font-size="14" font-weight="600" fill="currentColor" fill-opacity="0.9" text-anchor="middle">中断不是一个动作，是一条链路</text>
  </g>
</svg>
