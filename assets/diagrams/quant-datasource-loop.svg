<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="核心循环由找因子、调策略、严格执行三个环节首尾相接，自建数据管道在循环之外持续吃掉维护时间">
  <title>把时间留给循环</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity="0.5"/>
    </marker>
  </defs>
  <g stroke-linejoin="round">
    <text x="36" y="48" font-size="24" fill="currentColor" fill-opacity="0.9" text-anchor="start" font-weight="600">把时间留给循环</text>
    <text x="36" y="78" font-size="14" fill="currentColor" fill-opacity="0.55" text-anchor="start">数据是燃料，策略循环才是引擎</text>

    <rect x="155" y="106" width="190" height="56" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
    <text x="250" y="139" font-size="16" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">找因子</text>
    <rect x="36" y="270" width="170" height="56" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
    <text x="121" y="303" font-size="16" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">调策略</text>
    <rect x="290" y="270" width="170" height="56" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
    <text x="375" y="303" font-size="16" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">严格执行</text>

    <line x1="195" y1="162" x2="140" y2="270" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="206" y1="298" x2="290" y2="298" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="355" y1="270" x2="300" y2="162" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="248" y="243" font-size="13" fill="currentColor" fill-opacity="0.55" text-anchor="middle">核心循环</text>

    <rect x="496" y="116" width="188" height="124" rx="10" fill="#d97706" fill-opacity="0.06" stroke="#d97706" stroke-opacity="0.42" stroke-width="1.5"/>
    <text x="590" y="150" font-size="15" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">自建数据管道</text>
    <text x="590" y="180" font-size="12" fill="currentColor" fill-opacity="0.55" text-anchor="middle">爬虫 · 建库 · 定时维护</text>
    <text x="590" y="210" font-size="14" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">时间黑洞 · 本末倒置</text>

    <line x1="345" y1="150" x2="496" y2="178" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
    <text x="420" y="140" font-size="12" fill="currentColor" fill-opacity="0.55" text-anchor="middle">时间被吃掉</text>

    <rect x="36" y="356" width="648" height="52" rx="10" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="360" y="387" font-size="15" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">管道外包给数据源，时间留给核心循环</text>
  </g>
</svg>
