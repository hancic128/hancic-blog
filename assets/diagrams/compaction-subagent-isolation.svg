<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="子代理隔离：大文件读取、大工具输出、全仓搜索交给子代理处理，主对话只拿回结论，单轮增量被结构上截断">
  <title>大消息源交给子代理，主对话只拿结论</title>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke-linejoin="round">
    <text x="360" y="26" font-size="14" fill="currentColor" fill-opacity="0.6" text-anchor="middle">让主对话的单轮增量变成可预估的</text>

    <rect x="40" y="50" width="230" height="120" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
    <text x="155" y="78" font-size="16" font-weight="600" fill="currentColor" fill-opacity="0.9" text-anchor="middle">主对话</text>
    <text x="155" y="104" font-size="13" fill="currentColor" fill-opacity="0.6" text-anchor="middle">只拿结论</text>
    <text x="155" y="128" font-size="13" fill="currentColor" fill-opacity="0.6" text-anchor="middle">单轮增量可控</text>
    <text x="155" y="152" font-size="12" fill="currentColor" fill-opacity="0.55" text-anchor="middle">摘要 + 决策</text>

    <rect x="420" y="50" width="260" height="120" rx="10" fill="#d97706" fill-opacity="0.06" stroke="#d97706" stroke-opacity="0.42" stroke-width="1.5"/>
    <text x="550" y="78" font-size="16" font-weight="600" fill="currentColor" fill-opacity="0.9" text-anchor="middle">子代理</text>
    <text x="550" y="104" font-size="13" fill="currentColor" fill-opacity="0.6" text-anchor="middle">大文件全文</text>
    <text x="550" y="128" font-size="13" fill="currentColor" fill-opacity="0.6" text-anchor="middle">大工具输出</text>
    <text x="550" y="152" font-size="12" fill="currentColor" fill-opacity="0.55" text-anchor="middle">全仓搜索</text>

    <line x1="282" y1="110" x2="414" y2="110" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <text x="350" y="96" font-size="12" fill="currentColor" fill-opacity="0.55" text-anchor="middle">任务：大文件 / 全仓搜索</text>
    <line x1="414" y1="110" x2="282" y2="110" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <text x="350" y="138" font-size="12" fill="currentColor" fill-opacity="0.55" text-anchor="middle">只回结论</text>

    <text x="550" y="192" font-size="12" fill="currentColor" fill-opacity="0.55" text-anchor="middle">子代理自己压缩失败，不影响主对话</text>

    <rect x="40" y="212" width="640" height="44" rx="10" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="360" y="239" font-size="14" font-weight="600" fill="currentColor" fill-opacity="0.9" text-anchor="middle">失败被隔离，主对话的余量不会在一轮里被吃光</text>

    <text x="360" y="290" font-size="13" fill="currentColor" fill-opacity="0.6" text-anchor="middle">大文件全文、全仓 grep、大 SQL 结果是失败的头号诱因</text>
  </g>
</svg>
