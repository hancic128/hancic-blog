    <circle cx="243" cy="182" r="2.8" fill="currentColor" fill-opacity="0.5"/>
    <circle cx="272" cy="196" r="4" fill="currentColor" fill-opacity="0.25"/>
    <circle cx="302" cy="186" r="3" fill="currentColor" fill-opacity="0.45"/>
    <circle cx="318" cy="206" r="2.6" fill="currentColor" fill-opacity="0.3"/>
    <circle cx="86" cy="212" r="3.8" fill="currentColor" fill-opacity="0.4"/>
    <circle cx="118" cy="222" r="2.8" fill="currentColor" fill-opacity="0.25"/>
    <circle cx="146" cy="208" r="3.4" fill="currentColor" fill-opacity="0.5"/>
    <circle cx="176" cy="224" r="2.6" fill="currentColor" fill-opacity="0.35"/>
    <circle cx="203" cy="210" r="4.2" fill="currentColor" fill-opacity="0.22"/>
    <circle cx="231" cy="226" r="3" fill="currentColor" fill-opacity="0.45"/>
    <circle cx="258" cy="212" r="2.6" fill="currentColor" fill-opacity="0.3"/>
    <circle cx="288" cy="226" r="3.6" fill="currentColor" fill-opacity="0.4"/>
    <circle cx="315" cy="220" r="2.8" fill="currentColor" fill-opacity="0.5"/>
    <circle cx="70" cy="240" r="2.6" fill="currentColor" fill-opacity="0.45"/>
    <circle cx="100" cy="236" r="3.4" fill="currentColor" fill-opacity="0.28"/>
    <circle cx="132" cy="242" r="2.4" fill="currentColor" fill-opacity="0.5"/>
    <circle cx="160" cy="238" r="3" fill="currentColor" fill-opacity="0.35"/>
    <circle cx="192" cy="244" r="2.8" fill="currentColor" fill-opacity="0.22"/>
    <circle cx="220" cy="236" r="3.8" fill="currentColor" fill-opacity="0.4"/>
