    <rect x="372" y="108" width="312" height="150" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
    <text x="528" y="136" font-size="16" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">模糊的精确</text>
    <text x="528" y="160" font-size="13" fill="currentColor" fill-opacity="0.55" text-anchor="middle">方向对，就够用</text>
    <line x1="410" y1="234" x2="648" y2="190" stroke="#d97706" stroke-opacity="0.85" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow)"/>

    <rect x="36" y="292" width="648" height="72" rx="10" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="360" y="320" font-size="15" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">数据是市场的简化投影：加维度 = 加噪声</text>
    <text x="360" y="346" font-size="14" fill="currentColor" fill-opacity="0.55" text-anchor="middle">知道自己缺什么，比堆数据更重要</text>
  </g>
