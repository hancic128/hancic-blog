    <text x="192" y="136" font-size="16" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">精确的模糊</text>
    <text x="192" y="160" font-size="13" fill="currentColor" fill-opacity="0.55" text-anchor="middle">维度越多，噪声越多</text>
    <circle cx="72" cy="186" r="3.2" fill="currentColor" fill-opacity="0.32"/>
