<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="左边精确的模糊是维度越多噪声越多的散点，右边模糊的精确是方向大致对但说不清时间点与幅度的虚线箭头">
  <title>数据越多，越清醒？</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>
  <g stroke-linejoin="round">
