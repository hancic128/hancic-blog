<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="用户请求先查版本号列表，命中从 NFS 加载执行，未命中从 OSS 下载到 NFS 后执行">
  <title>版本请求链路：缓存命中走 NFS，未命中先下载</title>
  <g stroke-linejoin="round">
  <rect x="20" y="60" width="140" height="52" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
  <text x="90" y="82" font-size="15" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">用户请求</text>
  <text x="90" y="102" font-size="11" fill="currentColor" fill-opacity="0.55" text-anchor="middle">执行某版本</text>
  <rect x="290" y="60" width="140" height="52" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
  <text x="360" y="82" font-size="15" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">版本号列表</text>
  <text x="360" y="102" font-size="11" fill="currentColor" fill-opacity="0.55" text-anchor="middle">版本号缓存</text>
  <rect x="560" y="60" width="140" height="52" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
  <text x="630" y="82" font-size="15" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">NFS</text>
  <text x="630" y="102" font-size="11" fill="currentColor" fill-opacity="0.55" text-anchor="middle">可执行文件</text>
  <line x1="160" y1="86" x2="288" y2="86" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="224" y="76" font-size="11" fill="currentColor" fill-opacity="0.55" text-anchor="middle">查缓存</text>
  <line x1="430" y1="86" x2="558" y2="86" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="494" y="76" font-size="11" fill="currentColor" fill-opacity="0.55" text-anchor="middle">命中 → 加载</text>
  <rect x="290" y="162" width="140" height="52" rx="10" fill="none" stroke="#d97706" stroke-opacity="0.42" stroke-width="1.5"/>
  <text x="360" y="184" font-size="15" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">OSS</text>
  <text x="360" y="204" font-size="11" fill="currentColor" fill-opacity="0.55" text-anchor="middle">归档代码包</text>
  <line x1="360" y1="114" x2="360" y2="160" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="372" y="140" font-size="11" fill="currentColor" fill-opacity="0.55" text-anchor="start">未命中 → 下载</text>
  <line x1="432" y1="188" x2="576" y2="188" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="500" y="178" font-size="11" fill="currentColor" fill-opacity="0.55" text-anchor="middle">存入 → 执行</text>
  <rect x="560" y="162" width="140" height="52" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
  <text x="630" y="184" font-size="15" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">NFS</text>
  <text x="630" y="204" font-size="11" fill="currentColor" fill-opacity="0.55" text-anchor="middle">命中加载执行</text>
  </g>
</svg>