<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-label="AI 分开发态和运行态两个阶段：开发态 AI 写 SQL 模板、人审口径后发布，运行态 AI 只能调用已发布指标，不能现场生成 SQL">
  <title>开发态写模板，运行态只调已发布指标</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke-linejoin="round">
    <rect x="30" y="40" width="290" height="170" rx="10" fill="#d97706" fill-opacity="0.06"/>
    <rect x="30" y="40" width="290" height="170" rx="10" fill="none" stroke="#d97706" stroke-opacity="0.42" stroke-width="1.5"/>
    <text x="175" y="78" font-size="17" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">开发态</text>
    <text x="175" y="120" font-size="14" fill="currentColor" fill-opacity="0.9" text-anchor="middle">AI 写 SQL 模板</text>
    <text x="175" y="158" font-size="13" fill="currentColor" fill-opacity="0.55" text-anchor="middle">人审口径 · 人发布</text>

    <text x="360" y="100" font-size="12" fill="currentColor" fill-opacity="0.55" text-anchor="middle">发布</text>
    <line x1="320" y1="125" x2="400" y2="125" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="400" y="40" width="290" height="170" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
    <text x="545" y="78" font-size="17" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">运行态</text>
    <text x="545" y="120" font-size="14" fill="currentColor" fill-opacity="0.9" text-anchor="middle">AI 只调已发布指标</text>
    <text x="545" y="158" font-size="13" fill="currentColor" fill-opacity="0.55" text-anchor="middle">不能现场生成 SQL</text>

    <rect x="30" y="228" width="660" height="44" rx="10" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="360" y="257" font-size="14" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">写 SQL 的能力只在开发态，运行态完全关掉</text>
  </g>
</svg>
