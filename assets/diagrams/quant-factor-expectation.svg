<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="每次下注可能亏也可能赢，重复 N 次之后由大数定律兑现概率优势，因子在乎多笔期望而不在乎一笔对错">
  <title>因子为什么能工作</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke-linejoin="round">
    <text x="36" y="48" font-size="23" fill="currentColor" fill-opacity="0.9" text-anchor="start" font-weight="600">因子为什么能工作</text>
    <text x="36" y="78" font-size="14" fill="currentColor" fill-opacity="0.55" text-anchor="start">不赌单次对错，赌重复很多次后的期望为正</text>

    <rect x="280" y="112" width="160" height="52" rx="10" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
    <text x="360" y="145" font-size="17" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">每次下注</text>

    <rect x="110" y="212" width="170" height="48" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
    <text x="195" y="243" font-size="15" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">这单可能亏</text>
    <rect x="440" y="212" width="170" height="48" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
    <text x="525" y="243" font-size="15" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">这单可能赚</text>

    <line x1="310" y1="164" x2="245" y2="212" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="410" y1="164" x2="475" y2="212" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="195" y1="260" x2="285" y2="320" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="525" y1="260" x2="435" y2="320" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="36" y="320" width="648" height="88" rx="10" fill="#d97706" fill-opacity="0.06" stroke="#d97706" stroke-opacity="0.42" stroke-width="1.5"/>
    <text x="360" y="352" font-size="16" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">重复 N 次，期望为正</text>
    <text x="360" y="382" font-size="14" fill="currentColor" fill-opacity="0.55" text-anchor="middle">大数定律：概率优势兑现，因子不在乎一笔对错</text>
  </g>
</svg>
