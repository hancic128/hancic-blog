<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="触发判断算的是对话历史 950K 加余量 50K，压缩请求实际带的是对话历史加重注入内容和摘要输出空间，比窗口多出来一截">
  <title>压缩请求带的，比触发判断算的多</title>
  <g stroke-linejoin="round">
    <text x="360" y="26" font-size="14" fill="currentColor" fill-opacity="0.6" text-anchor="middle">触发判断算的，和压缩请求带的，不是同一份</text>

    <rect x="60" y="60" width="600" height="44" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="60" y="60" width="540" height="44" rx="8" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
    <rect x="600" y="60" width="60" height="44" fill="#d97706" fill-opacity="0.06" stroke="#d97706" stroke-opacity="0.42" stroke-width="1.5"/>
    <text x="330" y="87" font-size="15" fill="currentColor" fill-opacity="0.9" text-anchor="middle">对话历史 950K</text>
    <text x="630" y="87" font-size="14" fill="currentColor" fill-opacity="0.9" text-anchor="middle">余量</text>
    <text x="60" y="124" font-size="12" fill="currentColor" fill-opacity="0.55">1M 窗口，触发点 95%</text>
    <text x="660" y="124" font-size="12" fill="currentColor" fill-opacity="0.55" text-anchor="end">只剩 50K</text>

    <text x="60" y="150" font-size="12" fill="currentColor" fill-opacity="0.55">压缩请求实际带的</text>
    <rect x="60" y="156" width="500" height="44" rx="8" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
    <rect x="560" y="156" width="80" height="44" fill="#d97706" fill-opacity="0.06" stroke="#d97706" stroke-opacity="0.42" stroke-width="1.5"/>
    <rect x="640" y="156" width="60" height="44" fill="#d97706" fill-opacity="0.06" stroke="#d97706" stroke-opacity="0.42" stroke-width="1.5"/>
    <text x="310" y="183" font-size="15" fill="currentColor" fill-opacity="0.9" text-anchor="middle">对话历史 950K</text>
    <text x="600" y="183" font-size="13" fill="currentColor" fill-opacity="0.9" text-anchor="middle">重注入</text>
    <text x="670" y="183" font-size="13" fill="currentColor" fill-opacity="0.9" text-anchor="middle">摘要</text>
    <text x="640" y="222" font-size="12" fill="currentColor" fill-opacity="0.55" text-anchor="middle">比窗口多出来的那部分</text>

    <rect x="60" y="240" width="600" height="44" rx="10" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="360" y="267" font-size="15" font-weight="600" fill="currentColor" fill-opacity="0.9" text-anchor="middle">压缩本身要消耗余量，却偏在最紧的时候触发</text>
  </g>
</svg>
