<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="增量合并三条路：无重叠直接拼接，全覆盖整体替换，部分重叠分桶去重">
  <title>增量合并：按重叠情况走三条路</title>
  <g stroke-linejoin="round">
    <rect x="300" y="20" width="120" height="44" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
    <text x="360" y="47" font-size="16" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">新数据</text>
    <line x1="360" y1="64" x2="360" y2="110" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
    <line x1="360" y1="64" x2="130" y2="110" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
    <line x1="360" y1="64" x2="590" y2="110" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="30" y="110" width="200" height="84" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
    <text x="130" y="145" font-size="15" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">无重叠</text>
    <text x="130" y="171" font-size="13" fill="currentColor" fill-opacity="0.55" text-anchor="middle">直接拼接</text>
    <rect x="260" y="110" width="200" height="84" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
    <text x="360" y="145" font-size="15" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">全覆盖</text>
    <text x="360" y="171" font-size="13" fill="currentColor" fill-opacity="0.55" text-anchor="middle">整体替换</text>
    <rect x="490" y="110" width="200" height="84" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
    <text x="590" y="145" font-size="15" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">部分重叠</text>
    <text x="590" y="171" font-size="13" fill="currentColor" fill-opacity="0.55" text-anchor="middle">分桶去重</text>
  </g>
</svg>