name: Deploy

# 触发：只允许 tag（v*）。相对旧 ci.yaml 的三处改动，理由：
#
# 1) 去掉 `push: branches: [main]` 与 `pull_request`
#    - app-deploy《部署规范》：业务仓库 workflow 只允许 tag 或手动触发（个人账户 2000 min/月额度）
#    - 旧触发会在每次提交/PR 上跑 cargo test + Playwright，既烧额度，也和「发版才动 Actions」相冲突
#    - 日常回归在本地跑（本地有 rust 1.88 + e2e 环境），tag 时的 test job 作为发布闸门
#
# 2) 去掉 docker job 里的 SSH 直连部署步骤（原 Deploy to Shanghai）
#    - 本仓库是**公开仓库**：CI 里不得出现主机 IP / 内部路径 / 密钥。旧步骤显式引用了
#      secrets.HANCIC_SH_HOST、secrets.HANCIC_SH_SSH_KEY 并把 SSH 私钥写进 runner 的 ~/.ssh
#    - 部署收口到 app-deploy（镜像搬运 + SSH + 健康检查都在那边做），本仓库只出镜像 + 发一个 dispatch
#    - 顺带修掉旧的镜像名漂移：ghcr.io/angryshark128/hancic → ghcr.io/hancic128/hancic-blog，
#      必须与 app-deploy services/hancic-blog/target.conf 的 `images: [hancic-blog]` 对齐
#
# 注意：tag 触发用的是「被打 tag 的那个 commit 上的 workflow 文件」——
# 必须先把本文件合并进 main，再打 tag，否则那次 tag 不会触发任何东西。

on:
  push:
    tags: ['v*']

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # 半途取消一次发布比排队更糟（镜像/镜像搬运可能只做了一半）

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # GitHub-hosted runner 根分区约 72GB，预装 Android SDK / .NET / GHC / CodeQL 等
      # 与 Rust 无关的工具约 22GB。cargo target（~5GB）+ Playwright 浏览器（~1.5GB）
      # + node_modules 会把剩余空间用尽——upload_* 测试曾报 os error 28
      # （No space left on device）。构建前删掉这些不用的预装工具释放空间。
      - name: 释放 runner 磁盘空间
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift \
            /opt/az \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      # rust-toolchain.toml 固定 1.88.0。显式安装同一版本并带上 clippy 组件，
      # 避免 rustup 按目录文件自动安装 minimal profile（无 clippy）导致后续
      # cargo clippy 找不到工具；版本与本地开发环境对齐，CI 结果可复现。
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      # cargo 构建缓存：依赖编译产物跨 run 复用，test job 从 ~10min 压到 2-3min
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      # assets 已提交入库（T13），此步用于验证 fetch-assets.sh 仍可用（含代理回退路径）。
      # 若因网络受限下载失败，只要 assets/vendor/vditor.min.js 在（已入库）即短路通过。
      - name: 拉取前端资产（验证脚本；网络失败时短路）
        run: |
          bash scripts/fetch-assets.sh || {
            echo "::warning::fetch-assets.sh 下载失败（网络受限？），assets 已提交入库，跳过继续"
            [ -f assets/vendor/vditor.min.js ]
          }

      # 仓库 .cargo/config.toml 指向 rsproxy 镜像（本地开发用）。cargo 不支持用
      # --config 把 crates-io 替换回官方源，故在 CI 移除该文件让 cargo 走官方 crates.io
      # ——与 Docker 构建一致（.dockerignore 已排除 .cargo/config.toml）。
      - name: 去除 rsproxy 镜像配置（CI 直连 crates.io）
        run: rm -f .cargo/config.toml

      # 仓库存在既有 rustfmt 漂移（M125），cargo fmt --check 无法全绿且格式化属本地职责，
      # 故 CI 不跑 fmt；以 clippy -D warnings 兜底代码质量。
      - name: Clippy（-D warnings）
        run: cargo clippy --all-targets -- -D warnings

      - name: 单元/集成测试
        run: cargo test

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: E2E 依赖安装（Playwright）
        run: |
          cd e2e
          npm ci --registry=https://registry.npmjs.org/ --replace-registry-host=always
          npx playwright install --with-deps chromium

      - name: Playwright E2E
        run: cd e2e && npx playwright test

  docker:
    # 测试不过不允许构建推镜像（镜像一旦进 ghcr + ACR，app-deploy 就会开始部署）
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4        # tag 触发 → 自动检出的就是被打 tag 的 commit

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像名 = app 名 = app-deploy services/<app> 目录名：
      #   ghcr.io/hancic128/hancic-blog:<tag>  →  app-deploy 搬到 ACR 后为 <ACR>/hancic128/hancic-blog:<tag>
      # tag 直接用 git tag 名（与 app-deploy 手动回滚时填的 tag 一致）。
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/hancic128/hancic-blog:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dispatch:
    # 镜像已进 ghcr，交给 app-deploy：从 ghcr 搬 ACR → SSH 到 sh → docker compose pull/up -d → healthcheck.sh
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: 触发 app-deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          # fine-grained PAT：Contents 读写，仅授权 hancic128/app-deploy（私有仓库，只读权限会 403）
          token: ${{ secrets.APP_DEPLOY_DISPATCH_TOKEN }}
          repository: hancic128/app-deploy
          event-type: deploy
          # app 必须等于 app-deploy/services/ 下的目录名；tag 必须等于上面推的镜像 tag
          client-payload: |
            {"app":"hancic-blog","tag":"${{ github.ref_name }}"}
