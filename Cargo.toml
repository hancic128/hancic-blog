[package]
name = "hancic"
version = "0.1.0"
edition = "2024"
description = "寒蝉 Hancic —— 简洁自托管的博客与内容发布系统（Rust + SQLite）"
license = "MIT"
repository = "https://github.com/Angryshark128/hancic-blog"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
image = { version = "0.25.10", features = ["jpeg", "png", "webp", "gif"] }
ip2region = "0.1.0"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
quick-xml = "0.41.0"
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["json", "form", "cookies", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio", "time", "chrono"] }
subtle = "2.6.1"
tera = { version = "2.1.0", features = ["glob_fs"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["fs", "cors", "limit", "trace"] }
tower-sessions = "0.14.0"
tower-sessions-sqlx-store = { version = "0.15.0", features = ["sqlite"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4"] }
zip = { version = "8.6.0", features = ["deflate"] }
