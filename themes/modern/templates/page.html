{# 独立页（post_type=page）：不显示页面标题，右侧目录导航（内容长时便于跳转） #}
{% include "partials/header.html" %}
<div class="layout-two-col">
  <main class="layout-main">
    <article class="page">
      <div class="page-toolbar">
        <button class="reading-toggle" type="button" data-reading-toggle aria-pressed="false" title="隐藏菜单栏与侧栏，专注阅读">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <span data-reading-label>阅读模式</span>
        </button>
      </div>
      {{ content_html | safe }}
    </article>
  </main>

  <aside class="layout-side">
    {% if toc %}
    <div class="side-card">
      <h4 class="side-title">目录</h4>
      <ul class="side-toc toc-list">
        {% for item in toc %}
        <li class="toc-l{{ item.level }}"><a href="#{{ item.id }}">{{ item.text }}</a></li>
        {% endfor %}
      </ul>
    </div>
    {% endif %}
  </aside>
</div>
{% include "partials/footer.html" %}
